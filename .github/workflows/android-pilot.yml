name: Android Pilot

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-pilot.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-pilot.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-pilot:
    name: Debug pilot validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle test --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: APK metadata
        run: |
          mkdir -p ../release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../release-artifacts/proof2impact-android-debug-${GITHUB_SHA::7}.apk
          sha256sum ../release-artifacts/*.apk | tee ../release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proof2impact-android-debug-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Signed release candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Materialize signing key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Assemble signed release
        run: gradle :app:assembleRelease --no-daemon
      - name: Checksum release APK
        run: |
          mkdir -p ../release-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../release-artifacts/proof2impact-android-${GITHUB_REF_NAME}.apk
          sha256sum ../release-artifacts/*.apk | tee ../release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proof2impact-android-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
